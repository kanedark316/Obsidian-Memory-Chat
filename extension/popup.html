<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Save to Obsidian</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      margin: 0;
      padding: 12px;
      width: 280px;
      color: #1c1a17;
      background: #f7f3ea;
    }
    h1 { font-size: 14px; margin: 0 0 8px; }
    p { font-size: 12px; color: #5c564c; margin: 0 0 10px; }
    label { font-size: 11px; color: #5c564c; display: block; margin-bottom: 4px; }
    input {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 8px;
      padding: 6px 8px;
      border: 1px solid #d9d0c0;
      border-radius: 8px;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 999px;
      padding: 8px 10px;
      background: #0f6b5c;
      color: #f7fffc;
      font-weight: 600;
      cursor: pointer;
    }
    #status { margin-top: 8px; font-size: 12px; min-height: 1.2em; }
    .ok { color: #1f7a3f; }
    .err { color: #9b1c1c; }
  </style>
</head>
<body>
  <h1>Save chat to Obsidian</h1>
  <p>
    Reads the open ChatGPT page (conversation or public <strong>share</strong> link).
    Sends it to your local app — no ChatGPT API.
  </p>
  <label for="endpoint">Local import URL</label>
  <input id="endpoint" type="text" />
  <button id="save" type="button">Save to Obsidian</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
