[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatgpt-obsidian-memory"
version = "0.1.0"
description = "Capture ChatGPT chats locally (paste/drop + browser extension) into an Obsidian vault for Cursor agents. No ChatGPT API."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "ChatGPT Obsidian Memory" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "typer>=0.12.0",
  "rich>=13.9.0",
  "python-multipart>=0.0.12",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]

[project.scripts]
chatgpt-obsidian-memory = "chatgpt_obsidian_memory.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/chatgpt_obsidian_memory"]

[tool.hatch.build.targets.wheel.force-include]
"src/chatgpt_obsidian_memory/web/static" = "chatgpt_obsidian_memory/web/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
